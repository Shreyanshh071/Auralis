# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.injected.androidTest.leaveApksInstalledAfterRun=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
compose.desktop.packaging.checkJdkVendor=false
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# Public production endpoint, shared by Android and Windows builds.
connect.realtime.url=wss://auralis-connect.auralis018.workers.dev/v1/connect

# Account library on Cloudflare (docs/library-sync/spec.md). Blank = rollout off: apps never contact
# the library service and keep syncing the library through Firestore. Set to the production
# https:// origin only after the service is deployed and activation is approved.
library.sync.url=

# Account sync for settings, and later listening history (docs/library-sync/account-sync-proposal.md).
# Blank = off: settings keep syncing through Firestore. Same origin as library.sync.url when set.
account.sync.url=

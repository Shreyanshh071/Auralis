# Public production endpoint, shared by Android and Windows builds.
connect.realtime.url=wss://auralis-connect.auralis018.workers.dev/v1/connect

# Discover each account's library authority. Only explicitly migrated accounts use Cloudflare;
# legacy accounts continue using Firestore. Keep this enabled when rebuilding migrated devices.
library.sync.url=https://auralis-connect.auralis018.workers.dev

# Account sync for settings, and later listening history (docs/library-sync/account-sync-proposal.md).
# Blank = off: settings keep syncing through Firestore. Same origin as library.sync.url when set.
account.sync.url=

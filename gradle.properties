# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.injected.androidTest.leaveApksInstalledAfterRun=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
compose.desktop.packaging.checkJdkVendor=false
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# Public production endpoint, shared by Android and Windows builds.
connect.realtime.url=wss://auralis-connect.auralis018.workers.dev/v1/connect

# Discover each account's library authority. Only explicitly migrated accounts use Cloudflare;
# legacy accounts continue using Firestore. Keep this enabled when rebuilding migrated devices.
library.sync.url=https://auralis-connect.auralis018.workers.dev

# Account sync for listening history (docs/library-sync/account-sync-proposal.md). Settings sync was
# removed from the apps. Blank = off: history stays on Firestore. Same origin as library.sync.url.
account.sync.url=https://auralis-connect.auralis018.workers.dev

# Listen Together rooms on the Cloudflare room server (connect-server/src/together.js).
# Blank = off: rooms stay on Firestore. Joining still falls back to Firestore for older apps' rooms.
together.sync.url=https://auralis-connect.auralis018.workers.dev

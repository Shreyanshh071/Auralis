name = "auralis-connect"
main = "src/index.js"
compatibility_date = "2026-04-07"
workers_dev = true
preview_urls = false

# Never deploy from here without an explicit go-ahead: see docs/connect-websocket-plan.md.
[vars]
FIREBASE_PROJECT_ID = "auralis-70cf8"
# Listening history on the account service (src/listens-core.js). Settings sync was removed from the apps.
ACCOUNT_SYNC_TOPICS = "listens"

[[ratelimits]]
name = "CONNECT_UPGRADES"
namespace_id = "10401"
simple = { limit = 300, period = 60 }

[[durable_objects.bindings]]
name = "CONNECT"
class_name = "ConnectAccount"

# Account library (docs/library-sync/spec.md). Deploying this adds the namespace and routes only:
# every account stays `legacy` until the migration tool is run for it, and the admin routes answer
# 404 until LIBRARY_ADMIN_SECRET is set with `wrangler secret put`.
[[ratelimits]]
name = "LIBRARY_REQUESTS"
namespace_id = "10403"
simple = { limit = 600, period = 60 }

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "LibraryAccount"

# Listen Together rooms (docs/listen-together-cloudflare.md): one object per room code. The apps only
# use it when they are built with together.sync.url; otherwise rooms stay on Firestore.
[[ratelimits]]
name = "TOGETHER_UPGRADES"
namespace_id = "10405"
simple = { limit = 300, period = 60 }

[[durable_objects.bindings]]
name = "TOGETHER"
class_name = "ListenRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConnectAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LibraryAccount"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ListenRoom"]

# Throwaway measurement target: see docs/connect-staging-plan.md. STAGING_SECRET is set with
# `wrangler secret put` for this environment only, and production never has it.
[env.staging]
workers_dev = true

[env.staging.vars]
FIREBASE_PROJECT_ID = "auralis-70cf8"

[[env.staging.ratelimits]]
name = "CONNECT_UPGRADES"
namespace_id = "10402"
simple = { limit = 300, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "CONNECT"
class_name = "ConnectAccount"

[[env.staging.ratelimits]]
name = "LIBRARY_REQUESTS"
namespace_id = "10404"
simple = { limit = 600, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "LIBRARY"
class_name = "LibraryAccount"

[[env.staging.ratelimits]]
name = "TOGETHER_UPGRADES"
namespace_id = "10406"
simple = { limit = 300, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "TOGETHER"
class_name = "ListenRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ConnectAccount"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["LibraryAccount"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["ListenRoom"]
